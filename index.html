<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Clone</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121213;
            color: #fff;
        }
        #game-board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .tile {
            width: 60px;
            height: 60px;
            border: 2px solid #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
        }
        .tile.correct {
            background-color: #538d4e;
            border-color: #538d4e;
        }
        .tile.present {
            background-color: #b59f3b;
            border-color: #b59f3b;
        }
        .tile.absent {
            background-color: #3a3a3c;
            border-color: #3a3a3c;
        }
         .tile.filled {
            border-color: #565758;
        }
        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #guess-input {
            width: 200px;
            padding: 10px;
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }
        #message-area {
            height: 30px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Wordle</h1>
    <div id="message-area"></div>
    <div id="game-board"></div>
    <div id="controls">
         <input type="text" id="guess-input" maxlength="5" autofocus disabled>
         <button id="new-game-btn">New Game</button>
    </div>

    <script>
        const gameBoard = document.getElementById('game-board');
        const guessInput = document.getElementById('guess-input');
        const messageArea = document.getElementById('message-area');
        const newGameBtn = document.getElementById('new-game-btn');

        let currentGameId = null;
        let currentRowIndex = 0;

        // Initialize board
        for (let i = 0; i < 6; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            for (let j = 0; j < 5; j++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                row.appendChild(tile);
            }
            gameBoard.appendChild(row);
        }

        async function startNewGame() {
            try {
                const response = await fetch('/newgame');
                if (!response.ok) throw new Error('Failed to start new game');

                const { gameId } = await response.json();
                currentGameId = gameId;

                resetBoard();
                messageArea.textContent = 'Guess a 5-letter word.';
                guessInput.disabled = false;
                guessInput.focus();
                newGameBtn.textContent = "New Game";

            } catch (error) {
                messageArea.textContent = `Error: ${error.message}`;
            }
        }

        async function handleGuess(event) {
            if (event.key !== 'Enter') return;

            const guess = guessInput.value;
            if (guess.length !== 5) {
                messageArea.textContent = "Guess must be 5 letters!";
                return;
            }

            try {
                const response = await fetch('/guess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: currentGameId, guess }),
                });

                const data = await response.json();

                if (!response.ok) {
                   messageArea.textContent = data.error || 'An error occurred.';
                   if (data.solution) {
                       endGame(`You lose! The word was: ${data.solution.toUpperCase()}`);
                   }
                   return;
                }

                updateBoard(guess, data.results);

                if (data.isCorrect) {
                   endGame("You win!");
                } else if (data.guessesLeft === 0) {
                   endGame(`You lose! The word was: ${data.solution.toUpperCase()}`);
                } else {
                   currentRowIndex++;
                   guessInput.value = '';
                }


            } catch (error) {
                messageArea.textContent = `Error: ${error.message}`;
            }
        }

        function updateBoard(guess, results) {
            const row = gameBoard.children[currentRowIndex];
            for (let i = 0; i < 5; i++) {
                const tile = row.children[i];
                tile.textContent = guess[i];
                tile.classList.add(results[i]); // 'correct', 'present', or 'absent'
            }
        }

        function updateInputDisplay() {
            const row = gameBoard.children[currentRowIndex];
            const guess = guessInput.value.toUpperCase();
            for(let i = 0; i < 5; i++) {
                const tile = row.children[i];
                tile.textContent = guess[i] || '';
                 if(guess[i]) {
                    tile.classList.add('filled');
                } else {
                    tile.classList.remove('filled');
                }
            }
        }


        function resetBoard() {
            currentRowIndex = 0;
            for (const row of gameBoard.children) {
                for (const tile of row.children) {
                    tile.textContent = '';
                    tile.className = 'tile';
                }
            }
            guessInput.value = '';
        }

        function endGame(message) {
            messageArea.textContent = message;
            guessInput.disabled = true;
            newGameBtn.textContent = "Play Again?";
        }

        guessInput.addEventListener('keyup', handleGuess);
        guessInput.addEventListener('input', updateInputDisplay);
        newGameBtn.addEventListener('click', startNewGame);

        // Start the first game automatically on page load
        startNewGame();

    </script>
</body>
</html>
